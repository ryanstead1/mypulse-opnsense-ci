name: myPulse GitLab FreeBSD runner

run-name: "GitLab FreeBSD runner ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Calling GitLab pipeline/job identifier
        required: true
        type: string

permissions:
  contents: read

jobs:
  freebsd15:
    name: FreeBSD 15.1 GitLab worker
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Stage GitLab runner token
        shell: bash
        env:
          RUNNER_TOKEN: ${{ secrets.GITLAB_RUNNER_TOKEN }}
        run: |
          set -euo pipefail

          test -n "$RUNNER_TOKEN"

          umask 077
          printf '%s' "$RUNNER_TOKEN" > .gitlab-runner-token

      - name: Start FreeBSD 15.1
        uses: cross-platform-actions/action@v1.5.0
        with:
          operating_system: freebsd
          architecture: x86-64
          version: '15.1'
          memory: 6G
          cpu_count: 2
          sync_files: true

      - name: Run one isolated GitLab job
        shell: cpa.sh {0}
        run: |
          set -eu

          echo "======================================================"
          echo " myPulse ephemeral GitLab FreeBSD 15.1 worker"
          echo "======================================================"

          test -s .gitlab-runner-token

          TOKEN="$(cat .gitlab-runner-token)"
          rm -f .gitlab-runner-token

          echo
          echo "=== PLATFORM ==="

          uname -a
          freebsd-version

          test "$(uname -m)" = "amd64"
          test "$(freebsd-version -u | cut -d. -f1)" = "15"

          echo
          echo "=== PACKAGES ==="

          sudo pkg install -y \
            gitlab-runner \
            rust \
            git \
            pkgconf \
            bash

          gitlab-runner --version
          rustc --version
          cargo --version

          echo
          echo "=== ISOLATED BUILD USER ==="

          if ! pw groupshow mypulse-ci >/dev/null 2>&1; then
              sudo pw groupadd -n mypulse-ci
          fi

          if ! id mypulse-ci >/dev/null 2>&1; then
              sudo pw useradd \
                -n mypulse-ci \
                -g mypulse-ci \
                -m \
                -d /home/mypulse-ci \
                -s /usr/local/bin/bash
          fi

          sudo install \
            -d \
            -m 700 \
            -o mypulse-ci \
            -g mypulse-ci \
            /home/mypulse-ci/.ssh

          ssh-keygen \
            -q \
            -t ed25519 \
            -N '' \
            -f /tmp/mypulse-ci-key

          sudo install \
            -m 600 \
            -o root \
            -g wheel \
            /tmp/mypulse-ci-key \
            /root/mypulse-ci-key

          sudo install \
            -m 600 \
            -o mypulse-ci \
            -g mypulse-ci \
            /tmp/mypulse-ci-key.pub \
            /home/mypulse-ci/.ssh/authorized_keys

          rm -f \
            /tmp/mypulse-ci-key \
            /tmp/mypulse-ci-key.pub

          echo
          echo "=== RUNNER CONFIG ==="

          cat > /tmp/mypulse-runner.toml <<EOF
          concurrent = 1
          check_interval = 0

          [[runners]]
            name = "github-freebsd15-ephemeral"
            url = "https://gitlab.com/"
            token = "$TOKEN"
            executor = "ssh"

            [runners.ssh]
              host = "127.0.0.1"
              port = "22"
              user = "mypulse-ci"
              identity_file = "/root/mypulse-ci-key"
              disable_strict_host_key_checking = true
          EOF

          sudo install \
            -d \
            -m 700 \
            /root/.gitlab-runner

          sudo install \
            -m 600 \
            /tmp/mypulse-runner.toml \
            /root/.gitlab-runner/config.toml

          rm -f /tmp/mypulse-runner.toml
          unset TOKEN

          echo
          echo "=== LOCAL SSH ISOLATION TEST ==="

          sudo ssh \
            -i /root/mypulse-ci-key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            mypulse-ci@127.0.0.1 \
            'id && /usr/local/bin/bash --version | head -1'

          echo
          echo "=== WAITING FOR ONE GITLAB JOB ==="

          sudo gitlab-runner run-single \
            --config /root/.gitlab-runner/config.toml \
            --runner github-freebsd15-ephemeral \
            --max-builds 1 \
            --wait-timeout 1200

          echo
          echo "======================================================"
          echo " GitLab job complete - destroying worker"
          echo "======================================================"
